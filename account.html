<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Software Archive</title>
  <script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark");}
  </script>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
  <h1><i class="fas fa-archive"></i> Software Archive</h1>
  <div class="menu-toggle">☰</div>
  <nav>
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="archive.html"><i class="fas fa-box-open"></i> Archive</a>
    <a href="account.html"><i class="fas fa-sign-in-alt"></i> Login</a>
    <a href="account.html#register"><i class="fas fa-user-plus"></i> Register</a>
    <a href="admin.html"><i class="fas fa-user-shield"></i> Admin</a>
  </nav>

  <!-- Theme Toggle -->
  <div class="theme-toggle">
    <label class="switch">
      <input type="checkbox" id="theme-toggle">
      <span class="slider"></span>
    </label>
    <span id="theme-label">Light Mode</span>
  </div>
</header>



  <main class="account-page">
    <!-- Login Section -->
    <section class="account-section" id="login">
      <h2><i class="fas fa-sign-in-alt"></i> User Login</h2>
      <form>
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <button type="submit"><i class="fas fa-lock"></i> Login</button>
      </form>
    </section>

    <!-- Register Section -->
    <section class="account-section" id="register">
      <h2><i class="fas fa-user-plus"></i> Create Account</h2>
      <form>
        <label for="new-username">Username</label>
        <input type="text" id="new-username" placeholder="Choose a username">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email">

        <label for="new-password">Password</label>
        <input type="password" id="new-password" placeholder="Create password">

        <button type="submit"><i class="fas fa-user-check"></i> Register</button>
      </form>
    </section>
  </main>

  <footer>
    <p><i class="fas fa-archive"></i> © 2026 Software Archive</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
